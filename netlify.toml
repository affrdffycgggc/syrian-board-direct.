[build]
  command = "npm install --legacy-peer-deps && npx prisma generate --schema=./prisma/schema.prisma && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.20.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
